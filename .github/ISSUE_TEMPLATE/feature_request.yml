name: Feature request
description: Propose a focused improvement to MarketLens.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need, not only a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Explain the expected behavior, scope, and affected users.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Research pipeline
        - Provider SDK or adapter
        - Analytics or geospatial intelligence
        - AI insights
        - Export
        - UI or self-hosting
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
