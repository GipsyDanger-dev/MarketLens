name: Bug report
description: Report reproducible behavior that differs from the expected result.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please remove secrets, provider API keys, and personal data before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start from ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js, npm, Docker (if used), and provider details without credentials.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets and personally identifiable information.
