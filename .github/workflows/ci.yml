name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://marketlens:marketlens@localhost:5432/marketlens?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait
      - run: docker compose exec -T web npm run db:deploy
      - run: docker compose ps
      - if: always()
        run: docker compose down --volumes --remove-orphans
