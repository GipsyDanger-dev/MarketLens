services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketlens
      POSTGRES_USER: marketlens
      POSTGRES_PASSWORD: marketlens
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketlens -d marketlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://marketlens:marketlens@postgres:5432/marketlens?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: builder
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://marketlens:marketlens@postgres:5432/marketlens?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["npm"]
    command: ["run", "db:deploy"]

volumes:
  postgres-data:
